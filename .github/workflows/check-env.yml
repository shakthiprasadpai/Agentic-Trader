name: Check environment

on:
  pull_request:
  push:

jobs:
  check-env:
    name: Environment check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install project dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python - <<'PY'
import tomllib, sys, subprocess
py = tomllib.loads(open('pyproject.toml','rb').read())
deps = py.get('project', {}).get('dependencies', [])
pkgs = [d.split()[0] for d in deps]
if pkgs:
    print('Installing dependencies:', pkgs)
    subprocess.check_call([sys.executable, '-m', 'pip', 'install', *pkgs])
else:
    print('No dependencies found in pyproject.toml')
PY

      - name: Run environment checker
        run: |
          python scripts/check_env.py

      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Run pre-commit (auto-fix staged files)
        run: pre-commit run --all-files || true

      - name: Install dev tools (lint/test)
        run: python -m pip install --upgrade ruff pytest

      - name: Run linter (ruff)
        run: |
          echo "Running ruff..."
          ruff check .

      - name: Run tests (if present)
        run: |
          if [ -d tests ] || ls -1 | grep -qE '^test'; then
            echo "Running pytest..."
            pytest -q
          else
            echo "No tests directory or test files found; skipping pytest"
          fi
