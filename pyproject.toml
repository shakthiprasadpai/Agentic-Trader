[project]
name = "autonomous-agents"
version = "0.1.0"
description = "OpenAlgo Autonomous AI Trading Agent"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "openai-agents[litellm,sqlalchemy]>=0.1.0",
    "openalgo>=0.1.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "pytz>=2024.1",
    "numba>=0.60.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "colorama>=0.4.6",
    "ta-lib>=0.4.28",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
# Dev/test-only dependencies
dev = [
    "pydantic>=2.0.0",
    "pydantic-core>=2.0.0"
]

[tool.ruff]
line-length = 210
target-version = "py312"
extend-select = ["E", "F", "W", "C90", "I"]
extend-ignore = ["C901"]
exclude = ["docs", ".venv", "build", "dist"]

